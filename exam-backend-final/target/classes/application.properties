spring.application.name=exam-portal-backend

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/examdb}
spring.datasource.username=postgres
spring.datasource.password=kedar
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'update' is convenient for development; switch to 'validate' once you manage
# schema via migration scripts (Flyway/Liquibase) in production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT ---
# Generate a real secret for production, e.g.: openssl rand -base64 64
jwt.secret=${JWT_SECRET:c2VjdXJlLWRldi1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2QtZXhhbXBvcnRhbC1qd3Qtc2lnbmluZy1rZXk=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# --- Default admin seeded on first boot (change immediately after login) ---
app.seed.admin-username=${SEED_ADMIN_USERNAME:admin}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:ChangeMe@123}

# --- CORS: allow the Vite dev server ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
